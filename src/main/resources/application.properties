# ---- App ----
spring.application.name=hqli-example
server.port=8443

# ---- H2 (in-memory) ----
spring.datasource.url=jdbc:h2:mem:hqli;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA/Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Create tables from your @Entity classes at startup
spring.jpa.hibernate.ddl-auto=create
# For tests you might prefer: create-drop
# spring.jpa.hibernate.ddl-auto=create-drop

# Optional: log SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
